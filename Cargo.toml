[workspace]
resolver = "2"
members = [
    "crates/spork-hash",
    "crates/spork-canon",
    "crates/spork-ignore",
    "crates/spork-cas",
    "crates/spork-asset",
    "crates/spork-cas-cli",
    "crates/spork-migrate",
    "crates/spork-log",
    "crates/spork-projection",
    "crates/spork-status",
    "crates/spork-edges",
    "crates/spork-registry",
    "crates/spork-graph",
    "crates/spork-ipc",
    "crates/spork-broker",
    "crates/spork-vault",
    "crates/spork-stream",
    "crates/spork-drift",
    "crates/spork-restore",
    "crates/spork-git",
    "crates/spork-daemon",
    "crates/spork-exec",
    "crates/spork-runner",
    "crates/spork-provider",
    "crates/spork-context",
    "crates/spork-merge",
    "crates/spork-nodes",
    "crates/spork-cost",
]

# The Tauri desktop app (F3-UI) is a SEPARATE, standalone cargo workspace under
# app/src-tauri (it declares its own empty [workspace] table). Excluding it here
# guarantees the 27-crate core workspace green-bar can never be broken by the
# additive UI slice (CLAUDE.md C2/C3; DESIGN.md §14.1). Build the app from
# app/src-tauri, never from this root.
exclude = ["app/src-tauri"]

# Shared external dependencies pinned once here so every member crate resolves
# to the same version. Member crates reference these with `workspace = true`.
[workspace.dependencies]
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.150"
thiserror = "2.0.18"
blake3 = "1.8.5"
hex = "0.4.3"
globset = "0.4.18"
fastcdc = "4.0.1"
rayon = "1.11.0"
reflink-copy = "0.1.30"
walkdir = "2.5.0"
clap = { version = "4.6.1", features = ["derive"] }
anyhow = "1.0.102"
rusqlite = { version = "0.37.0", features = ["bundled"] }
ulid = "1.2.1"
semver = "1.0.27"

# F3 headless-core shared external dependencies.
notify = "8.2.0"
regex = "1.12.4"
zeroize = "1.9.0"
crossbeam-channel = "0.5.15"
# spork-git compiles libgit2 from source via the `vendored-libgit2` feature so
# `.git` access never depends on a system libgit2 (probed building here in this
# environment). default-features are off to avoid linking a system libgit2.
git2 = { version = "0.21.0", default-features = false, features = ["vendored-libgit2"] }

# Dev-only shared dependencies.
proptest = "1.11.0"
tempfile = "3.27.0"
