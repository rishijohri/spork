[package]
name = "spork-ipc"
version = "0.1.0"
edition = "2021"
description = "Spork F3 typed IPC contract: the frozen Command / CommandResult / OpLogEvent / EphemeralFrame envelope the daemon implements and the future renderer binds to (DESIGN §5.5, §14.1, §14.4, A.1)."

[dependencies]
spork-graph = { path = "../spork-graph" }
spork-hash = { path = "../spork-hash" }
ulid = { workspace = true, features = ["serde"] }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }

[dev-dependencies]
serde_json = { workspace = true }
